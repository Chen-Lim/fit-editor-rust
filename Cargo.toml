[package]
name = "fit-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Chen <chenchemlim@gmail.com>"]
description = "Pure-Rust CLI tool for viewing, editing, and converting Garmin FIT files"
repository = "https://github.com/Chen-Lim/fit-editor-rust"
keywords = ["fit", "garmin", "cli", "sport", "gps"]
categories = ["command-line-utilities"]

[[bin]]
name = "fit-editor"
path = "src/main.rs"

[dependencies]
fit-sdk-rust = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
colored = "2"
chrono = "0.4"
glob = "0.3"
tabled = "0.15"
indicatif = "0.17"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
# strip = true  # requires rust-version >= 1.77
